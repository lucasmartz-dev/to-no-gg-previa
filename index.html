<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#4A3626">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="To No GG Restaurante">
<meta property="og:title" content="To No GG · Cardápio do dia">
<meta property="og:description" content="Marmitas na Chácara Guanabara, em Mogi das Cruzes. Veja o prato de hoje e peça pelo WhatsApp.">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;800&family=Oswald:wght@500;600;700&family=Permanent+Marker&display=swap">
<link rel="stylesheet" href="css/tonogg.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Restaurant",
  "name": "To No GG Restaurante",
  "description": "Marmitas com cardápio do dia na Chácara Guanabara, em Mogi das Cruzes. Pedidos pelo WhatsApp.",
  "image": "img/og.jpg",
  "servesCuisine": ["Brasileira", "Comida caseira"],
  "priceRange": "R$ 30 a R$ 40",
  "telephone": "+55-11-97643-0686",
  "hasMenu": "#cardapio",
  "acceptsReservations": false,
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Rua Minas Gerais, 48",
    "addressLocality": "Mogi das Cruzes",
    "addressRegion": "SP",
    "postalCode": "08779-510",
    "addressCountry": "BR"
  },
  "geo": { "@type": "GeoCoordinates", "latitude": -23.3572, "longitude": -46.1590 },
  "areaServed": "Chácara Guanabara, Mogi das Cruzes"
}
</script>
<meta name="robots" content="noindex, nofollow">
<style>.previa{margin:0;padding:7px 16px;background:#2B1E15;color:#EEE3CD;text-align:center;font:500 13px/1.3 Oswald,"Arial Narrow",sans-serif;letter-spacing:.04em}</style>
</head>
<body>
  <p class="previa">Prévia do site · proposta de Lucas Martz</p>
  <header class="topo">
    <span class="x-costura" style="left:6%;top:30px;transform:rotate(8deg)" aria-hidden="true"></span>
    <span class="x-costura escuro" style="right:7%;top:54px;width:40px;height:40px" aria-hidden="true"></span>
    <a class="logo remendo" href="index.html" aria-label="To No GG Restaurante, início">
      <img src="img/logo-icone.svg" alt="" width="150" height="55">
      <b id="logo-nome">TO NO GG</b>
      <small id="logo-tipo">RESTAURANTE</small>
    </a>
  </header>

  <section class="faixa banner" aria-labelledby="titulo">
    <div class="miolo">
      <div class="banner-topo">
        <h1 class="titulo gasto" id="titulo"><span>Cardápio</span><span>do dia!</span></h1>
        <img class="chapeu" src="img/chapeu.svg" alt="" width="190" height="112">
      </div>
      <p class="data" id="data"></p>
      <div class="prato-dia" id="prato-dia"></div>
    </div>
  </section>

  <main class="miolo">
    <section class="cardapio" id="cardapio" aria-labelledby="t-cardapio">
      <h2 class="fita" id="t-cardapio">Todo dia tem</h2>
      <div class="fixos" id="fixos"></div>
    </section>

    <div class="duas">
      <section class="pedido" id="pedido" aria-labelledby="t-pedido">
        <h2 class="fita" id="t-pedido">Faça já o seu pedido!</h2>
        <div class="remendo form-card" id="form-card"></div>
      </section>
      <section class="contato" aria-label="Contato e endereço">
        <div class="painel-contato costura" id="painel-contato"></div>
      </section>
    </div>
  </main>

  <footer class="rodape">
    <div class="miolo">
      <svg viewBox="0 0 24 30" aria-hidden="true"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20.4 12 30 12 30s12-9.6 12-18.3C24 5.2 18.6 0 12 0zm0 16a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z" fill="#BE2A21"/></svg>
      <div>
        <b id="rod-end">Rua Minas Gerais, 48</b>
        <span id="rod-ref">Nos prédios amarelos, perto do Mercado Marily's</span>
        <small>Chácara Guanabara, Mogi das Cruzes · site por Lucas Martz</small>
      </div>
    </div>
  </footer>

  <div class="sacola" id="sacola" hidden><button type="button" id="sacola-btn" data-act="ir-pedido"></button></div>
  <div class="aviso" id="aviso" role="status" hidden></div>

  <script src="js/dados.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
